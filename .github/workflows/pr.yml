# Every pull request's tests: the core suite on Windows, once per push (opened, a new push, reopened, ready for review),
# never on a label or an edit, as eight shards side by side (`run_tests.py --shard I/N`, packed by the tracked
# tests/test_times.json: four packed by file size took 27-38 min, 2026-11-21) and the public module suites beside them;
# the one `tests` job passes only if every shard and the module suites passed, and it is the check the branch requires
# and the job pr-merge.yml reads. A pull request that changes only docs (docs/, any *.md) runs no Windows job.
# Merging is pr-merge.yml's: a pull request into 3.0-dev or 2.x-dev merges itself when the session adds the `reviewed`
# label after its local review (the register is kept outside this repo), if these tests passed on its head commit. A new
# push takes the label off: new commits need a new review. main takes only pull requests the owner merges.
name: PR tests
# pr-merge.yml finds this pull request's run by this name and the head commit.
run-name: "PR #${{ github.event.pull_request.number }} tests (into ${{ github.base_ref }})"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Docs only (every changed file, and every renamed one's old name, under docs/ or ending in .md, none in a tests/
    # folder): no test run. Anything it can't tell for sure runs the tests.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > files.txt
          total=$(gh pr view "$PR" --repo "$REPO" --json changedFiles --jq .changedFiles)
          awk '/^tests\// || /\/tests\// || !(/^docs\// || /\.md$/)' files.txt > code.txt
          head -n 20 code.txt
          lines=$(wc -l < files.txt); other=$(wc -l < code.txt)
          # Docs only needs the whole list (the files API lists at most 3,000) and not one other file.
          if [ "$lines" -gt 0 ] && [ "$total" -lt 3000 ] && [ "$lines" -ge "$total" ] && [ "$other" -eq 0 ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs only ($total files): no test run."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  shards:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}     # a failed check of the files runs them
    name: core ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: windows-latest
    timeout-minutes: 45     # a backstop: a shard takes about an eighth of the suite's time (~14 of ~114 min)
    strategy:
      fail-fast: false      # every shard runs to the end: one red shard still shows the others' results
      # Eight: a Free account runs 20 jobs at once, so two pull requests' runs (8 shards + the module suites each) fit
      # side by side; a third waits for runners, as it would with fewer, longer shards.
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (the versions the release is built with)
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.0.0 numpy==1.25.2 fugashi==1.5.2 unidic-lite==1.0.8 pysrt==1.1.2 EbookLib==0.20
          beautifulsoup4==4.12.2 soupsieve==2.4 lxml==4.9.2 requests==2.28.2 tkinterdnd2==0.4.3 jieba==0.42.1
          pytest==9.0.2 python-dotenv==1.0.0 zstandard==0.25.0
          PyQt6==6.11.0 PyQt6-Qt6==6.11.2 PyQt6-sip==13.13.0
          mcp==2.3.0
      - name: The folders the tests expect
        shell: bash
        run: mkdir -p data/ja data/zh "User Files"
      - name: Core suite, one shard
        env:
          PYTHONIOENCODING: utf-8
          TMP: ${{ runner.temp }}         # on the checkout's drive: one test takes a path relative to the repo
          TEMP: ${{ runner.temp }}
        shell: bash
        # Never retried, and the same tests the local `run_tests.py --all` runs: the Tk window tests too (3.0.1,
        # tests/FLAKES.md; Tk's own start steadied as locally, tests/quiet_windows.py). Only SURASURA_SKIP_TK_TESTS=1
        # would skip them (tests/tk_on_github.py).
        run: python run_tests.py --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  modules:
    # The public module suites, each in its own pytest process as `run_tests.py --all` runs them (the private ones are
    # not in this repo).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: module suites
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (the versions the release is built with)
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.0.0 numpy==1.25.2 fugashi==1.5.2 unidic-lite==1.0.8 pysrt==1.1.2 EbookLib==0.20
          beautifulsoup4==4.12.2 soupsieve==2.4 lxml==4.9.2 requests==2.28.2 tkinterdnd2==0.4.3 jieba==0.42.1
          pytest==9.0.2 python-dotenv==1.0.0 zstandard==0.25.0
          PyQt6==6.11.0 PyQt6-Qt6==6.11.2 PyQt6-sip==13.13.0
          mcp==2.3.0
      - name: The folders the tests expect
        shell: bash
        run: mkdir -p data/ja data/zh "User Files"
      - name: The AI voice (no model, no GPU, no network: its downloads, server and Anki are faked)
        env:
          PYTHONIOENCODING: utf-8
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        shell: bash
        run: python -m pytest modules/irodori/tests -v -ra -p no:cacheprovider
      - name: Junban
        if: ${{ !cancelled() }}      # runs after a red AI voice too: every result shows
        env:
          PYTHONIOENCODING: utf-8
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        shell: bash
        run: python -m pytest modules/junban/tests -v -ra -p no:cacheprovider
      - name: YouTube transcripts
        if: ${{ !cancelled() }}      # runs after a red one before it too: every result shows
        env:
          PYTHONIOENCODING: utf-8
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        shell: bash
        run: python -m pytest modules/youtube_downloader/tests -v -ra -p no:cacheprovider

  tests:
    # The one result: passed only if every shard and the module suites passed (a docs-only pull request skips them).
    # always(), not !cancelled(): a run cancelled mid-shards must fail this check, never skip it (skipped reads green).
    needs: [changes, shards, modules]
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          SHARDS: ${{ needs.shards.result }}
          MODULES: ${{ needs.modules.result }}
        run: |
          echo "shards: $SHARDS, module suites: $MODULES"
          test "$SHARDS" = success && test "$MODULES" = success

  unreview:
    # New commits after a review: the label comes off at once, so nothing unreviewed can merge.
    if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'reviewed')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label reviewed
          echo "::notice::New commits since the review: the reviewed label is off. Review again, then add it back."
