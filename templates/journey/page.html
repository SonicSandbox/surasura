<script>

/* ⇄ ships with the simple Swap (D2); this one flag hides it, and it hides by itself while its route answers not_yet. */

/* ---- the page's settings (SPEC §1.4): Surasura's keys, written through the door; look ones applied here ---- */

const SETTINGS = [

  { k: "meanings", key: "journey_meanings", data: true, name: "Meanings", def: "en", opts: [["en", "English"], ["yours_en", "Yours, then English"], ["yours", "Yours only"]],

/* ---- icons ---- */

/* ---- the episodes (the head) ---- */
const EP = (i) => EPS[i];
const epId = (i) => EPS[i][0];

const epTitle = (i) => EPS[i][2];
function epPart(i) {                                  // the episode's own part of its title (the show is its row)
  const t = EPS[i][2], s = SHOWS[EPS[i][3]];

}
const showOf = (i) => SHOWS[EPS[i][3]] || ["", "", EPS[i][5], "sapphire"];
const GEMS = new Set(["sapphire", "emerald", "ruby"]);              // a gem names a colour token: only these three
const gemOf = (i) => { const g = showOf(i)[3] || KIND_GEM[EPS[i][5]]; return GEMS.has(g) ? g : "sapphire"; };

for (let i = 0; i < EPS.length; i++) if (EPS[i][0] != null) ID_IX.set(EPS[i][0], i);

/* pre-studied: the render's, then the door's answers; a press waits (pending) until its answer */
const PRE = new Map();                                // ep index -> {on, by, at, wait}
for (let i = 0; i < EPS.length; i++) if (EPS[i][11]) PRE.set(i, { on: true, at: EPS[i][11][0], by: EPS[i][11][1] });

/* ---- the words: gzip chunks, decoded when needed (§5.1) ---- */
const CHUNKS = new Map();                             // chunk index -> decoded {w0, src, w}
const DECODING = new Map();
function chunkOfWord(id) {
  let lo = 0, hi = CH.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (CH[m][0] <= id) lo = m; else hi = m - 1; }
  return lo;

async function gunzipJson(el) {
  const bin = atob(el.textContent.trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

}
function trimChunks(keep) {                           // the heap stays small: only a few chunks kept whole
  if (CHUNKS.size <= 6) return;
  for (const c of CHUNKS.keys()) {
    if (c === keep || c === chunkOfWord(EPS[S.ep] ? EPS[S.ep][8] : 0)) continue;
    CHUNKS.delete(c);

  }
}
function wordNow(id) {                                // a word, when its chunk is decoded; else null

/* the blobs: meanings, kanji and Yours, at idle (or on first use) */
const BLOBS = {};
function blob(name) {

/* ---- view state (not learning facts): in this browser, written after the first word ---- */

}

/* ---- marks (the word lists' own, read back), the walk and the filter ---- */
const MARK = new Map();                                // word -> "known" | "ignore" (the app's, or a sent press)
const MWAIT = new Map();                               // word -> "send" (in flight) | "wait" (slow) | "queued"

  for (const id of s) { const w = wordNow(id); const m = w && MARK.get(w[0]); if (m === "known") known++; else if (m === "ignore") ign++; }
  const n = nextEp(i, 1, false), filt = S.filter && !s.length;
  const up = n >= 0 ? `<div class="upn"><span class="k2">Up next</span>${kindIcon(EPS[n][5], gemOf(n))} <span class="jp">${esc(epTitle(n))}</span> ${stoneSvgWrap(n)} ${growthHtml(n)} <span class="pc ${pcClass(EPS[n][6])}">${fmtPct(EPS[n][6])}</span> · <b>${EPS[n][7]}</b> new</div>` : "";
  return `<div class="end"><div class="k">End of the ${EPS[i][5] && KIND_VERB[EPS[i][5]] === "read" ? "chapter" : "episode"}</div><h2>${kindIcon(EPS[i][5], gemOf(i))}<span>${esc(epTitle(i))}</span></h2>${preChip(i)}
${filt ? `<p class="counts">None of its words in ${esc(FILTERS[S.filter][0])}: they show with the filter off (${esc(keyOf("filter"))}).</p>` : growthHtml(i, true)}
<div class="counts">✓ ${known} known · ⊘ ${ign} ignored · ${s.length - known - ign} still to learn</div>
${n >= 0 ? `<div class="next"><button class="btn go" data-act="next" data-tip="Next episode (↓)">Next: ${esc(epTitle(n))} ↓</button></div>` : `<p class="counts">That was the last episode with new words.</p>`}${endNav(i, s.length > 0)}${up}</div>`;
}

/* ---- List view (§1.1): the episode's words as cards; the card under the top edge is the one the keys act on ---- */
let LIST_EP = -1, listObs = null;
const D14_MS = 1000;
function drawList() {
  const st = $("stage"), i = S.ep;
  if (!epReady(i)) { setHtml(st, `<div class="sk">Opening ${esc(epTitle(i))}…</div>`); loadEp(i).then(() => { resetSeqEp(i); drawList(); }); return; }
  const s = seq(i) || [];
  RC.drawList = (RC.drawList || 0) + 1;
  let h = `<div class="lv"><div class="meta"><span class="ml">${kindIcon(EPS[i][5], gemOf(i))} ${esc(epTitle(i))}</span> · ${s.length} words</div>`;
  s.forEach((id, k) => { h += `<div class="lc ${k === S.wi ? "cur" : ""}" data-k="${k}">${wordHtml(id, wordNow(id), true)}</div>`; });
  h += `<div class="lend" data-ep="${i}">${EPS[i][7] ? endHtml(i) : nothingHtml(i)}</div></div>`;
  setHtml(st, h);

}
function watchListEnd() {                              // D14: its end on screen one full second marks it
  if (listObs) listObs.disconnect();
  if (typeof IntersectionObserver === "undefined") return;
  const timers = new Map();
  listObs = new IntersectionObserver((ents) => {
    for (const en of ents) {
      const i = Number(en.target.dataset.ep);
      if (en.isIntersecting) { if (!timers.has(i)) timers.set(i, setTimeout(() => { timers.delete(i); prestudied(i, "end"); }, D14_MS)); }
      else { clearTimeout(timers.get(i)); timers.delete(i); }     // a fly-past doesn't count: its second starts again
    }
  }, { root: $("stage"), threshold: 0.6 });
  for (const el of document.querySelectorAll("#stage .lend")) listObs.observe(el);
}
function listScrolled() {
  if (!S.list) return;
  const st = $("stage"), top = st.getBoundingClientRect().top + 8;
  for (const el of st.querySelectorAll(".lc")) {
    if (el.getBoundingClientRect().bottom > top + 40) {
      const k = Number(el.dataset.k);
      if (k !== S.wi) { const old = st.querySelector(".lc.cur"); if (old) old.classList.remove("cur"); el.classList.add("cur"); S.wi = k; rail.update("where"); saveSoon(); }
      return;
    }
  }
}

/* ---- moving ---- */
function go(i, wi) {
  if (i == null || i < 0 || i >= EPS.length) return;
  const changed = i !== S.ep;
  if (changed) S.back = { ep: S.ep, wi: S.wi };
  S.ep = i; S.wi = wi == null ? 0 : wi; S.line = 0; S.pitchShown = false;
  if (S.wi < 0) { const s = seq(i); S.wi = s ? s.length : 0; }
  drawWord();
  rail.update("where");
  if (S.list) $("stage").scrollTop = 0;
  saveSoon();
  idle(() => { const n = nextEp(i, 1, false); if (n >= 0) loadEp(n); });
}
function step(d) {
  const s = seq(S.ep);
  if (!s) return;
  if (EPS[S.ep][7] === 0) {                          // a nothing-new card: ↑ the end of the one before, ↓ on
    if (d > 0) { const n = nextEp(S.ep, 1, false); if (n >= 0) go(n, 0); }
    else { const p = nextEp(S.ep, -1, false); if (p >= 0) go(p, -1); }
    return;
  }
  const wi = S.wi + d;
  if (wi < 0) { const p = nextEp(S.ep, -1, false); if (p >= 0) go(p, -1); return; }
  if (wi > s.length) { const n = nextEp(S.ep, 1, false); if (n >= 0) go(n, 0); return; }
  S.wi = wi; S.line = 0; S.pitchShown = false;
  drawWord(); rail.update("where"); saveSoon();
}
function epStep(d) { const j = nextEp(S.ep, d, true); if (j >= 0) go(j, 0); }

/* ▶ a line: the learner's own file, where this browser can play it; Connect's clip for the rest (clip/cut) */
const player = $("player");
let playEnd = null;
player.addEventListener("timeupdate", () => { if (playEnd != null && player.currentTime >= playEnd) { player.pause(); playEnd = null; } });
function mediaUrl(p) {                                  // "<dir index>/<path in it>" → its file: URL, or null
  const [dir, ...rest] = p.split("/"), file = rest.join("/");
  return PLAYABLE.test(file) && HEAD.dirs[Number(dir)] ? HEAD.dirs[Number(dir)] + file.split("/").map(encodeURIComponent).join("/") : null;
}
async function playLine(k) {
  const id = curWordId(), w = id != null && wordNow(id), ln = w && w[9][k];
  if (!ln) return;
  const src = srcOf(id, ln[1]); if (!src || !src[3]) return;
  let url = mediaUrl(src[3]);
  if (!url) {
    if (!live()) { toast("Surasura is closed: this line plays when the journey is open from Surasura."); return; }
    const a = await doorCall("clip/cut", { line_id: lineId(ln, src) });
    if (!a || !a.ok) { toast(a && a.error || "Surasura couldn't cut that line."); return; }
    url = `http://127.0.0.1:${DOOR.port}${a.url}`;
  }
  try { player.src = url; player.currentTime = ln[2] || 0; playEnd = ln[3]; await player.play(); } catch (e) { toast("This browser can't play that file."); }
}
async function playWord() {
  const id = curWordId(), w = id != null && wordNow(id);
  if (!w || !(w[6] & 8)) return;
  if (!live()) { toast("Surasura is closed: ▶ the word plays from your card when Surasura is open."); return; }
  const a = await doorCall("word/audio", { word: w[0] });
  if (!a || !a.ok) { toast(a && a.error || "No audio on its card."); return; }
  try { player.src = `http://127.0.0.1:${DOOR.port}${a.url}`; playEnd = null; await player.play(); } catch (e) {}
}

/* ---- search (/): every word, by spelling or reading ---- */
let searchReady = null;
function buildSearch() {
  if (!searchReady) searchReady = (async () => { for (let c = 0; c < CH.length; c++) if (!SIDX[c]) { const d = await loadChunk(c); indexChunk(c, d); } })();
  return searchReady;
}
let RES = [], RESI = 0;
async function search(q) {
  q = kana(q.trim()).toLowerCase();
  const box = $("res");
  if (!q) { box.classList.add("hide"); return; }
  await buildSearch();
  RES = [];
  for (let c = 0; c < SIDX.length && RES.length < 40; c++) {
    const a = SIDX[c]; if (!a) continue;
    for (let j = 0; j < a.length && RES.length < 40; j++) if (a[j].includes(q)) RES.push(CH[c][0] + j);
  }
  RESI = 0;
  box.innerHTML = RES.length ? RES.map((id, j) => { const m = smeta(id); return `<div class="ri ${j === 0 ? "on" : ""}" data-ri="${j}"><b>${esc(m[0])}</b><span>${esc(m[1])}</span><span class="e">${esc(epTitle(m[2]))}</span></div>`; }).join("") : `<div class="none">No word in your journey matches.</div>`;
  box.classList.remove("hide");
}

  const m = smeta(id); if (!m) return;
  const i = m[2], back = { ep: S.ep, wi: S.wi };
  await loadEp(i);
  $("res").classList.add("hide"); $("q").value = ""; $("q").blur();
  S.filter = 0; resetSeq();
  const s = seq(i) || [];
  go(i, Math.max(0, s.indexOf(id)));
  S.back = back;                                       // ⌫ goes back to where you were
}

/* ---- the presses, by click and by key ---- */
document.addEventListener("click", (e) => {

  }
  if ((el = c("[data-pre]"))) { prestudied(Number(el.dataset.pre), "press"); return; }

  if ((el = c("[data-flagit]"))) {

    if (!reasons.length) { toast("Pick what's wrong first."); return; }

  }
  if ((el = c("[data-unflag]"))) { closeLayer(); flagLine(curWordId(), Number(el.dataset.unflag), [], "", false); return; }
  if ((el = c("[data-li]")) && !S.list) { selLine(Number(el.dataset.li)); return; }
  if ((el = c("[data-mtab]"))) { S.open.mtab = el.dataset.mtab; drawDesk(); return; }
  if ((el = c("[data-open]"))) { S.open[el.dataset.open] = !S.open[el.dataset.open]; drawDesk(); saveSoon(); return; }

  if ((el = c(".srow [data-val]"))) { setSetting(el.closest(".srow").dataset.set, JSON.parse(el.dataset.val)); return; }

});
