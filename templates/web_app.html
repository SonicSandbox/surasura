        // --- Card Component ---
        // --- Word Card Component (Optimized) ---
        function createWordCard(data) {
            const el = document.createElement('div');
            el.className = 'card';

            const word = data.Word;
            const safeWord = escapeHtml(word);

            const escapedWordForRegex = safeWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escapedWordForRegex, 'gi');

            function formatContext(ctx) {
                if (!ctx) return "";
                const safeCtx = escapeHtml(ctx);
                return safeCtx.replace(regex, `<em>${safeWord}</em>`);
            }

            const c1 = data["Context 1"] || data.Context || "";
            const displayC1 = formatContext(c1);


            // Parse Tier data and create tier badges
            let tierBadgesHtml = '';
            if (data.Tier) {
                const tierStr = String(data.Tier).trim();
                if (tierStr === 'Outside') {
                    tierBadgesHtml = '';
                } else {
                    // Format: "Source1:Tier1;Source2:Tier2" or old format "1"
                    const tierParts = tierStr.split(';');
                    tierBadgesHtml = tierParts.map(part => {
                        if (part.includes(':')) {
                            const [source, tier] = part.split(':');

                            // Strictly abbreviate to the first letter in caps
                            // e.g., "global50k" -> "G", "anime" -> "A"
                            let displaySource = source.charAt(0).toUpperCase();

                            // Format: "G-3"
                            return `<span class="tier-badge tier-${tier}" title="${source}">${displaySource}-${tier}</span>`;
                        } else {
                            // Fallback for old format
                            return `<span class="tier-badge tier-${part}">${part}</span>`;
                        }
                    }).join('');
                }
            }

            // Stored as a data-attribute (HTML-escaped); the browser decodes it back to the raw
            // sentence for playAudio. Avoids fragile inline-JS-string quoting that broke on any
            // sentence containing a double-quote (it prematurely closed the onclick attribute).
            const audioSource = escapeHtml(c1 || word);
            const hideAudio = (typeof globalLogic !== 'undefined' && globalLogic.hide_audio_button);

            // Priority classification (drives the ✦ marker AND the "Show" filter)
            const pm = (typeof globalLogic !== 'undefined' && globalLogic.priority_markers) ? globalLogic.priority_markers : { priority_threshold: 0.5, priority_min: 3, lopsided_threshold: 0.8 };
            const pHigh = parseInt(data["Count (High)"]) || 0;
            const pLow = parseInt(data["Count (Low)"]) || 0;
            const pTotal = parseInt(data["Occurrences (Global)"] !== undefined ? data["Occurrences (Global)"] : (data.Occurrences !== undefined ? data.Occurrences : 0)) || 0;
            const isLopsided = pTotal > 0 && (pHigh / pTotal) >= pm.lopsided_threshold;
            const isPriority = !isLopsided && pTotal >= pm.priority_min && ((pHigh + pLow) / pTotal) >= pm.priority_threshold;
            if (isPriority) el.classList.add('is-priority');

            // Low-leverage words (Score < 10) get a subtle reddish tint (see .card.low-score).
            const _scoreVal = parseFloat(data.Score);
            if (!isNaN(_scoreVal) && _scoreVal < 10) el.classList.add('low-score');

            // Standard Card: Base HTML
            el.innerHTML = `
                <div class="card-header">
                    <div style="display:flex; align-items:center; gap: 10px;">
                        <span class="word-main">${safeWord}</span>
                        <span class="reading" data-reading="${data.Reading || ''}" migaku_ignore data-yomichan-ignore></span>
                        <button class="btn-audio" style="${hideAudio ? 'display:none' : ''}" data-audio="${audioSource}" onclick="playAudio(this.dataset.audio, this)" title="Listen to Sentence (Hotkey: v)">
                            <svg viewBox="0 0 24 24">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                            </svg>
                        </button>
                    </div>
                    <div style="display:flex; align-items:center; gap: 15px;">
                        <div class="stats" style="font-size: 0.9rem; color: var(--text-secondary);">
                            ${data.Score !== undefined ? `<span>Score: ${data.Score}</span>` : ''}
                            ${(data["Occurrences (Global)"] !== undefined) ? `<span>Freq: ${data["Occurrences (Global)"]}</span>` : (data.Occurrences !== undefined ? `<span>Freq: ${data.Occurrences}</span>` : '')}
                        </div>
                        ${isLopsided ? `<span class="priority-marker marker-lopsided" title="Lopsided: You'll see this word a lot in the next few weeks, but rarely after that"></span>` : (isPriority ? `<span class="priority-marker marker-priority" title="High Leverage: You'll see this word a lot now, and in 6+ months"></span>` : '')}
                        <div style="display:flex; gap: 5px; flex-wrap: wrap;">
                            ${tierBadgesHtml}
                        </div>
                    </div>
                </div>
                <div class="context-box">${displayC1}${sourceBadge(data["Src 1"], data["Frag 1"], data["At 1"])}</div>
            `;

            // Extra Contexts (DOM Pruning)
            // Dynamically load any context strings beyond Context 1
            const extraKeys = Object.keys(data).filter(k => k.startsWith('Context ') && k !== 'Context 1').sort((a, b) => {
                const numA = parseInt(a.replace('Context ', ''));
                const numB = parseInt(b.replace('Context ', ''));
                return numA - numB;
            });

            if (extraKeys.length > 0) {
                const extraDiv = document.createElement('div');
                extraDiv.className = "extra-contexts";

                // --- STANDARD MODE LOGIC (Toggle + Lazy Load) ---
                const btn = document.createElement('button');
                btn.className = "toggle-contexts-btn";
                btn.innerHTML = `<span class="arrow">▼</span>`;

                let loaded = false;

                // Toggle Logic
                const toggleLogic = () => {
                    if (!loaded) {
                        let innerHtmlString = "";
                        extraKeys.forEach(k => {
                            if (data[k]) {
                                const formatted = formatContext(data[k]);
                                // "Context 3" -> the matching "Src 3" / "Frag 3" for this sentence.
                                const n = k.replace('Context ', '');
                                const badge = sourceBadge(data['Src ' + n], data['Frag ' + n], data['At ' + n]);
                                innerHtmlString += `<div class="context-item">${formatted}${badge}</div>`;
                            }
                        });
                        extraDiv.innerHTML = innerHtmlString;
                        loaded = true;
                    }
                    extraDiv.classList.toggle('visible');
                    btn.classList.toggle('active');
                };

                btn.onclick = toggleLogic;

                el.appendChild(btn);
                el.appendChild(extraDiv);

                // Respect global state on init
                if (globalShowAllSentences) {
                    toggleLogic(); // Immediately expand
                }
            }

            // Footer
            const footer = document.createElement('div');
            footer.className = "card-footer";
            footer.innerHTML = `<div></div><div class="actions"><button class="btn btn-ignore" title="Ignore (Hotkey: z)" onclick="ignoreWord('${safeWord}', this)">Ignore</button></div>`;
            el.appendChild(footer);

            // Sources (DOM Pruned)
            if (data.Sources) {
                const sSection = document.createElement('div');
                sSection.className = "sources-section";
                const sToggle = document.createElement('div');
                sToggle.className = "sources-toggle";
                sToggle.textContent = `Show Sources (${data.Sources.split(',').length})`;
                const sList = document.createElement('div');
                sList.className = "sources-list";
                let sLoaded = false;
                sToggle.onclick = () => {
                    if (!sLoaded) {
                        sList.textContent = data.Sources;
                        sLoaded = true;
                    }
                    if (sList.style.display === 'block') {
                        sList.style.display = 'none';
                        sToggle.textContent = sToggle.textContent.replace("Hide", "Show");
                    } else {
                        sList.style.display = 'block';
                        sToggle.textContent = sToggle.textContent.replace("Show", "Hide");
                    }
                };
                sSection.appendChild(sToggle);
                sSection.appendChild(sList);
                el.appendChild(sSection);
            }
            return el;
        }

        function toggleExtraContexts(btn) {
            const extra = btn.nextElementSibling;
            extra.classList.toggle('visible');
            btn.classList.toggle('active');
        }

        // --- Actions ---
        function toggleSources(el) {
            const list = el.nextElementSibling;

            if (list.style.display === "block") {
                list.style.display = "none";
                el.textContent = el.textContent.replace("Hide", "Show");
            }

            else {
                list.style.display = "block";
                el.textContent = el.textContent.replace("Show", "Hide");
            }
        }

        async function ignoreWord(word, btnElement) {
            try {
                // 1. Add to Local Storage
                if (!ignoredWords.has(word)) {
                    ignoredWords.add(word);
                    saveIgnoredWords();
                    updateClearButtonVisibility();
                }

                // 2. Visual Feedback: Copy to clipboard (legacy behavior)
                await navigator.clipboard.writeText(word);

                // 3. Update Button State
                const originalText = btnElement.textContent;
                btnElement.textContent = "Ignored & Copied";
                btnElement.classList.add('ignored');
                btnElement.disabled = true;

                // 4. Remove Card (Visual)
                const card = btnElement.closest('.card');
                if (card) {
                    // Fade out and remove
                    card.style.transition = 'all 0.5s ease';
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.9)';
                    setTimeout(() => {
                        card.remove();
                        // Optional: trigger a stats update here if desired, 
                        // but simple removal is usually sufficient for static view.
                    }, 500);
                }

            } catch (err) {
                console.error('Ignore failed', err);
                alert('Failed to ignore/copy: ' + word);
            }
        }

        // --- Utils ---
        // --- Per-sentence source badge ---------------------------------------------------------- #
        // globalSourceDisplay: 'off' | 'icon' | 'filename' | 'full'  (Settings -> Experience & UI)
        // globalSources rows are [name, type, fullPath, groupLabel]; each sentence carries an index
        // into that table (interned by the generator, so a big library doesn't ship the same path
        // thousands of times). The badge SHOWS the short name, HOVERS group/file, and COPIES the
        // absolute path — so the clipboard contents paste straight into Explorer.
        const SOURCE_ICONS = { subtitle: '🎬', youtube: '▶', epub: '📖', text: '📄' };

        // A Chrome/Edge "scroll to text" link: opens the file AND jumps to + highlights the
        // sentence, like Ctrl+F. Shift-click copies this instead of the bare path (a bare path is
        // what Explorer needs, and a URL fragment would break that).
        //
        // The anchor is NOT guessed here. The sentence in this report is not the sentence in the
        // file — the tokenizer drops every space when it rebuilds a sentence, so a subtitle line
        // written as 'そうだ 女｡ お前に話がある｡' is stored as 'そうだ女｡お前に話がある。'.
        // Any anchor derived from the stored text spans gaps the file doesn't have. So the GENERATOR
        // verifies a snippet against the real file (see AnchorFinder) and passes it in as `frag`;
        // no frag means no link, rather than one that silently misses or hits the wrong line.
        function sourceDeepLink(fullPath, frag) {
            if (!fullPath || !frag) return '';
            let p = String(fullPath).replace(/\\/g, '/');
            if (!p.startsWith('/')) p = '/' + p;   // Windows 'C:/…' -> 'file:///C:/…'
            // encodeURI leaves '#' and '?' alone; in a FILENAME they would truncate the URL.
            const url = 'file://' + encodeURI(p).replace(/#/g, '%23').replace(/\?/g, '%3F');
            // '-' and ',' are text-fragment syntax characters and must be percent-encoded.
            return url + '#:~:text=' + encodeURIComponent(String(frag)).replace(/-/g, '%2D');
        }

        // Seconds -> '12:03' (or '1:02:03'). Used for the subtitle cue a sentence sits in.
        function fmtCueTime(sec) {
            const t = Math.max(0, Math.floor(Number(sec) || 0));
            const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
            const pad = n => String(n).padStart(2, '0');
            return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
        }

        function sourceBadge(idx, frag, at) {
            const mode = (typeof globalSourceDisplay !== 'undefined') ? globalSourceDisplay : 'off';
            if (mode === 'off' || idx === null || idx === undefined || idx === "") return '';
            const table = (typeof globalSources !== 'undefined' && globalSources) ? globalSources : null;
            const row = table ? table[idx] : null;
            if (!row) return '';   // results generated before the source table existed

            const name = row[0] || '';
            const icon = SOURCE_ICONS[row[1]] || SOURCE_ICONS.text;
            const fullPath = row[2] || name;
            // group/file, e.g. 'test_book/chapter_1.txt' — plus the cue time for subtitles.
            let hover = row[3] || name;
            if (at !== null && at !== undefined && at !== "") hover += ' @ ' + fmtCueTime(at);
            let label;
            if (mode === 'icon') label = icon;
            else if (mode === 'filename') label = escapeHtml(name);
            else label = icon + ' ' + escapeHtml(name);

            // A YouTube source is the one case where the FILE isn't the thing you want — the video
            // is. Click opens it at this sentence's moment; shift-click copies that link. Rendered
            // as a real anchor so middle-click, ctrl-click and "copy link address" all work.
            const videoId = row[4] || '';
            if (videoId) {
                const secs = (at !== null && at !== undefined && at !== "")
                    ? '?t=' + Math.max(0, Math.floor(Number(at) || 0)) : '';
                const href = 'https://youtu.be/' + encodeURIComponent(videoId) + secs;
                // Shift-click opens the TRANSCRIPT at this sentence instead — the same
                // scroll-to-text link every other source uses.
                const transcript = sourceDeepLink(fullPath, frag);
                return `<a class="src-badge" href="${escapeHtml(href)}" target="_blank" rel="noopener" ` +
                       `migaku_ignore data-yomichan-ignore data-src-path="${escapeHtml(href)}" ` +
                       `data-src-url="${escapeHtml(href)}" ` +
                       (transcript ? `data-src-transcript="${escapeHtml(transcript)}" ` : ``) +
                       `title="${escapeHtml(hover)}\nClick to open the video here` +
                       (transcript ? `\nShift-click to open the transcript at this sentence` : ``) +
                       `" onclick="return youtubeBadgeClick(event, this)">${label}</a>`;
            }

            // Paths live in data-attributes, not inline JS strings: a filename containing a
            // double-quote would otherwise close the onclick attribute early (the same bug the
            // Listen button hit).
            const deepLink = sourceDeepLink(fullPath, frag);
            return `<span class="src-badge" migaku_ignore data-yomichan-ignore ` +
                   `data-src-path="${escapeHtml(fullPath)}" ` +
                   (deepLink ? `data-src-url="${escapeHtml(deepLink)}" ` : ``) +
                   `title="${escapeHtml(hover)}\nClick to copy the full path` +
                   (deepLink ? ` (shift-click: browser link that jumps to this sentence)` : ``) + `" ` +
                   `onclick="copySourcePath(event, this)">${label}</span>`;
        }

        // Activate a URL the way a real link click does. Preferred over window.open because a
        // file:// navigation is far more likely to be allowed when it comes from an anchor.
        function openInNewTab(url) {
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        // Plain click follows the anchor and opens the VIDEO at this sentence's moment.
        // Shift-click opens the TRANSCRIPT at the same sentence — the browser would otherwise
        // open a new window, so it has to be intercepted. With no verified anchor to jump to,
        // fall back to copying the video link rather than doing nothing.
        function youtubeBadgeClick(event, el) {
            if (event && event.shiftKey) {
                event.preventDefault();
                const transcript = el.dataset.srcTranscript;
                if (transcript) openInNewTab(transcript);
                else copySourcePath(event, el);
                return false;
            }
            return true;
        }

        function copySourcePath(event, el) {
            if (event) event.stopPropagation();
            // Shift-click copies the scroll-to-text browser link; a plain click copies the bare
            // path, because that's what pasting into Explorer requires.
            const wantsLink = !!(event && event.shiftKey && el.dataset.srcUrl);
            const path = wantsLink ? el.dataset.srcUrl : (el.dataset.srcPath || '');
            if (!path) return;
            const previous = el.innerHTML;
            const confirm = () => {
                el.textContent = wantsLink ? 'link copied ✓' : 'copied ✓';
                setTimeout(() => { el.innerHTML = previous; }, 1200);
            };
            // navigator.clipboard needs a secure context and the report is opened over file://,
            // which some browsers don't treat as one — fall back to the legacy textarea trick.
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(path).then(confirm).catch(() => legacyCopy(path, confirm));
            } else {
                legacyCopy(path, confirm);
            }
        }

        function legacyCopy(text, onDone) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                onDone();
            } catch (e) {
                // No clipboard access — the hover tooltip still shows the full path.
            }
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }

        // --- Audio Logic ---
        function playAudio(text, btnElement) {
            if (!text) return;
            const lang = (typeof globalLanguage !== 'undefined') ?
                (globalLanguage === 'zh' ? 'zh-CN' : 'ja-JP') : 'ja-JP';

            // Visual feedback
            if (btnElement) {
                btnElement.style.opacity = '1';
                btnElement.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    btnElement.style.opacity = '0.5';
                    btnElement.style.transform = 'scale(1)';
                }, 200);
            }

            // Cancel any ongoing speech to prevent queuing/overlapping
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        }

        // --- Smart Navigation ---
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;

            const isNext = e.code === 'Space' || e.code === 'ArrowRight' || e.key === 'z' || e.key === 'Z';
            const isPrev = e.code === 'ArrowLeft';
            const isUp = e.code === 'ArrowUp';
            const isDown = e.code === 'ArrowDown';
            const isIgnore = e.key === 'z' || e.key === 'Z';
            const isAudio = e.key === 'v' || e.key === 'V';
            const isComplete = e.key === 'w' || e.key === 'W';
            const isSort = e.key === 's' || e.key === 'S';

            if (!isNext && !isPrev && !isUp && !isDown && !isAudio && !isComplete && !isSort) return;

            // Don't navigate if user is typing in an input/textarea
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            // File-level shortcuts — handled directly, no card scanning needed (O(1))
            if (isComplete) {
                e.preventDefault();
                // Only meaningful on the Progressive view (where a file is open)
                const progView = document.getElementById('view-progressive');
                if (progView && progView.classList.contains('active')) toggleCurrentFileComplete();
                return;
            }
            if (isSort) {
                e.preventDefault();
                cyclePriorityFilter();
                return;
            }


            // Prevent default scrolling/caret movement for all navigation keys
            // Exception: Allow Up/Down in Zen mode if it's NOT a custom interaction
            if (isNext || isPrev || isUp || isDown) {
                e.preventDefault();
            }

            // Selection: Standard themes have scrollable containers, Zen uses window
            const scroller = document.querySelector('.view.active .word-list-container');
            if (!scroller) return;

            const activeCards = Array.from(document.querySelectorAll('.view.active .card'));
            if (activeCards.length === 0) return;

            const scrollerHeight = scroller.clientHeight;
            const scrollerTop = scroller.getBoundingClientRect().top;
            const centerLine = scrollerTop + (scrollerHeight / 2);

            let currentIndex = -1;
            let minDistance = Infinity;

            activeCards.forEach((card, index) => {
                const rect = card.getBoundingClientRect();
                const cardCenter = rect.top + (rect.height / 2);
                const distance = Math.abs(cardCenter - centerLine);

                if (distance < minDistance) {
                    minDistance = distance;
                    currentIndex = index;
                }
            });

            if (currentIndex === -1) return;

            // Handle Context Toggle (Up/Down) - only in standard mode
            if (isUp || isDown) {
                const centeredCard = activeCards[currentIndex];
                const toggleBtn = centeredCard.querySelector('.toggle-contexts-btn');
                if (toggleBtn) {
                    const isShown = toggleBtn.classList.contains('active');
                    if (isDown && !isShown) {
                        toggleBtn.click();
                    } else if (isUp && isShown) {
                        toggleBtn.click();
                    }
                }
                return; // Don't perform navigation
            }

            if (isIgnore) {
                const centeredCard = activeCards[currentIndex];
                const ignoreBtn = centeredCard.querySelector('.btn-ignore');
                if (ignoreBtn && !ignoreBtn.disabled) {
                    ignoreBtn.click();
                }
            }

            if (isAudio) {
                const centeredCard = activeCards[currentIndex];
                const audioBtn = centeredCard.querySelector('.btn-audio');
                if (audioBtn) {
                    audioBtn.click();
                }
            }

            // Handle Context Toggle (Up/Down) - only in standard mode
            if (isUp || isDown) {
                const centeredCard = activeCards[currentIndex];
                const toggleBtn = centeredCard.querySelector('.toggle-contexts-btn');
                if (toggleBtn) {
                    const isShown = toggleBtn.classList.contains('active');
                    if (isDown && !isShown) {
                        toggleBtn.click();
                    } else if (isUp && isShown) {
                        toggleBtn.click();
                    }
                }
                return; // Don't perform navigation
            }

            // Handle Navigation (Next/Prev)
            if (isNext || isPrev) {
                let targetIndex = isNext ? currentIndex + 1 : currentIndex - 1;
                if (targetIndex < 0) targetIndex = 0;
                if (targetIndex >= activeCards.length) targetIndex = activeCards.length - 1;

                const targetCard = activeCards[targetIndex];
                if (targetCard) {
                    const rect = targetCard.getBoundingClientRect();
                    const cardHeight = rect.height;

                    // Target: Card center at 35% from top of scroller viewport (15% above middle)
                    const offset = (scrollerHeight * 0.35) - (cardHeight / 2);

                    const containerRect = scroller.getBoundingClientRect();
                    const currentScroll = scroller.scrollTop;
                    const cardTopRelativeToContainer = rect.top - containerRect.top;

                    scroller.scrollTo({
                        top: currentScroll + cardTopRelativeToContainer - offset,
                        behavior: 'smooth'
                    });
                }
            }
        });

    </script>
</body>

</html>
