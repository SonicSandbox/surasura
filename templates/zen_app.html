<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surasura - Zen Mode</title>
    <style>
        :root {
            --bg: #000000;
            --fg: #e0e0e0;
            --dim: #666666;
            --accent: #ffffff;
            --prio-high: #ffd700;
            --prio-lop: #03dac6;
            --prio-reading: #d0a5ff;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Courier New', Courier, monospace;
            /* Minimalist / Terminal feel */
            margin: 0;
            padding: 0;
            overflow-y: scroll;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Centered Container */
        .container {
            width: 100%;
            max-width: 560px;
            /* Reduced by 20% from 700px */
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* --- Header / Logo --- */
        .zen-header {
            text-align: center;
            padding: 15px 0;
            background: #000;
            /* Solid-ish background for stickiness */
            backdrop-filter: blur(5px);
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 1000;
            margin-bottom: 20px;

            opacity: 1;
            /* Keep container opacity 1 for background */
            /* filter: grayscale(100%);  <-- Moving this to children */
            transition: all 0.4s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Apply dimming to children so background stays black */
        .zen-header>* {
            opacity: 0.2;
            filter: grayscale(100%);
            transition: all 0.4s;
        }

        .zen-header:hover>* {
            opacity: 1;
            filter: grayscale(0%);
        }

        .zen-header h1 {
            font-size: 1.5rem;
            margin: 0;
            margin-left: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: normal;
        }

        /* --- Progress Bar (Detailed) --- */
        .comprehension-stats {
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .header-stats {
            /* Wrapper adjustments */
            margin-bottom: 20px;
            border: none;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #ccc;
        }

        .progress-container {
            height: 10px;
            background: #222;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            display: flex;
            width: 100%;
        }

        .progress-segment {
            height: 100%;
            transition: width 0.5s ease-out;
        }

        .segment-base {
            background: #4caf50;
            opacity: 0.3;
        }

        .segment-start {
            background: #4caf50;
            opacity: 0.6;
        }

        .segment-target {
            background: #4caf50;
        }

        .legend {
            display: flex;
            gap: 15px;
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
            display: none;
            /* Hide Legend in Zen Mode for cleaner look */
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        /* --- Word List --- */
        .word-item {
            margin-bottom: 60px;
            /* Large spacing for focus */
            padding-bottom: 40px;
            border-bottom: 1px dashed #222;
        }

        .word-header {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 15px;
        }

        .word-main {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
        }

        /* Advanced Hiding: Reversed text in DOM, corrected visually by CSS */
        .reading {
            font-size: 1.2rem;
            color: var(--dim);
            pointer-events: none;
            user-select: none;
        }

        .reading::before {
            content: attr(data-content);
            unicode-bidi: bidi-override;
            direction: rtl;
        }

        .meta-info {
            margin-left: auto;
            font-size: 0.9rem;
            color: var(--dim);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Priority Icons */
        .prio-icon {
            font-size: 1rem;
        }

        .prio-high {
            color: var(--prio-high);
        }

        .prio-lop {
            color: var(--prio-lop);
        }

        .prio-reading {
            color: var(--prio-reading);
            font-size: 0.85em;
        }

        /* Contexts */
        .context-box {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ccc;
        }

        .context-line {
            margin-bottom: 12px;
            display: block;
            margin-left: 20px;
            /* Clear Indentation */
            padding-left: 12px;
            border-left: 3px solid #444;
            /* Visible indicator */
        }

        /* Per-sentence source badge — inline after the sentence, muted enough not to break Zen's
           calm, and hidden from dictionary extensions. Off by default (Settings -> Experience & UI). */
        .src-badge {
            margin-left: 0.6em;
            font-size: 0.7rem;
            color: #777;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        a.src-badge {
            text-decoration: none;
        }

        .src-badge:hover {
            color: #aaa;
        }

        /* Speech: audio-ready shown as DIM-vs-LIT, not as a colour. Most badge glyphs are emoji
           from a COLOR font, which CSS `color` cannot tint — so the icon lights up instead.
           Mirrors web_app.html. */
        .src-badge.koe-speak {
            filter: grayscale(1);
            opacity: 0.45;
        }

        .src-badge.koe-speak.koe-ready {
            filter: none;
            opacity: 1;
            color: #5fd39a;
        }

        .src-badge.koe-speak:hover {
            filter: none;
            opacity: 1;
        }

        /* Speech (optional): the badge becomes a small spinner while a sentence is being
           generated, then returns to its icon. Mirrors web_app.html. */
        .koe-spinner {
            display: inline-block;
            width: 0.8em;
            height: 0.8em;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            vertical-align: -0.1em;
            animation: koe-spin 0.7s linear infinite;
        }

        @keyframes koe-spin { to { transform: rotate(360deg); } }

        .context-line em {
            color: #ffffff;
            /* Fully White */
            font-style: normal;
            text-decoration: underline;
            text-decoration-color: #555;
            text-underline-offset: 3px;
        }

        /* --- Key Functions Footer --- */
        .key-functions {
            margin-top: auto;
            padding-top: 40px;
            padding-bottom: 20px;
            width: 100%;
            max-width: 700px;
            text-align: center;
            color: #444;
            font-size: 0.8rem;
            border-top: 1px solid #222;
        }

        .key-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 5px;
        }

        kbd {
            background: #222;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: #888;
        }

        /* Utility */
        .hidden {
            display: none;
        }

        /* Extension avoidance */
        [migaku_ignore],
        [data-yomichan-ignore] {
            /* Marker classes/attributes */
        }

        /* Cursor Hiding */
        .no-select {
            user-select: none;
            cursor: default;
        }

        /* Help Icon */
        .help-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .help-icon {
            width: 40px;
            height: 40px;
            background: #111;
            color: #ccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: help;
            transition: background 0.2s;
        }

        .help-icon:hover {
            background: #555;
            color: #fff;
        }

        .help-tooltip {
            position: absolute;
            bottom: 50px;
            right: 0;
            background: #222;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 8px;
            width: 250px;
            display: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .help-container:hover .help-tooltip {
            display: block;
        }

        .help-key-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }

        /* Visual Offset for Extra Contexts */
        .context-box {
            margin-top: 15px;
            padding-left: 15px;
            border-left: 3px solid #333;
            /* Continuous vertical line */
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .context-line {
            display: block;
            color: #ccc;
            line-height: 1.5;
            border: none !important;
            /* Force removal of any inherited borders */
            margin: 0 !important;
            /* Remove margins that might separate lines */
            padding: 0;
        }

        /* Performance & Cursor */
        .word-item {
            content-visibility: auto;
            /* Huge performance win */
            contain-intrinsic-size: 1px 200px;
            /* Estimate height */
        }

        body,
        .word-main,
        .reading {
            cursor: default;
            /* Hide text cursor */
            user-select: none;
            /* Prevent selection */
        }

        .context-line {
            cursor: default;
            /* Keep arrow cursor even over text */
            user-select: text;
            /* Allow text selection */
        }

        /* Global Caret Hiding */
        * {
            caret-color: transparent;
            /* Hides the blinking text insertion cursor */
        }
    </style>

</head>

<body>
    <div id="app" class="container">
        <!-- Logo Header -->
        <div class="zen-header">
            <!-- Generator will replace h1 with logo+h1 if set -->
            <h1>Surasura List</h1>
        </div>

        <!-- Word List Container -->
        <div id="word-list">
            <!-- Items injected here -->
        </div>
    </div>
    <!-- Floating Help Icon -->
    <div class="help-container">
        <div class="help-icon">?</div>
        <div class="help-tooltip">
            <div class="help-key-row"><span>Next Word</span><span><kbd>Space</kbd>/ <kbd>→</kbd></span></div>
            <div class="help-key-row"><span>Prev Word</span><span><kbd>←</kbd></span></div>
            <div class="help-key-row"><span>Scroll</span><span><kbd>j</kbd>/ <kbd>k</kbd></span></div>
        </div>
    </div>
    <script>
        // Global Error Handler for Debugging (Zen Mode Black Screen)
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            const container = document.body;
            const errorBox = document.createElement('div');
            errorBox.style.position = 'fixed';
            errorBox.style.top = '0';
            errorBox.style.left = '0';
            errorBox.style.width = '100%';
            errorBox.style.background = '#800';
            errorBox.style.color = '#fff';
            errorBox.style.padding = '20px';
            errorBox.style.zIndex = '9999';
            errorBox.style.fontFamily = 'monospace';
            errorBox.innerHTML = `<h3>Zen Mode Crash</h3><p>${msg}</p><p>Line: ${lineNo}</p>`;
            container.appendChild(errorBox);
            return false;
        };
    </script>
    <script>let globalData = null;
    </script>
    <script> // --- Core Logic ---

        // --- Data Decompression Helper ---
        function decompressData(compressedObj) {
            if (!compressedObj || !compressedObj.keys || !compressedObj.rows) {
                return compressedObj; // Not in compressed format
            }

            return compressedObj.rows.map(rowArray => {
                const rowObj = {};
                compressedObj.keys.forEach((key, index) => {
                    if (rowArray[index] !== null) {
                        rowObj[key] = rowArray[index];
                    }
                });
                return rowObj;
            });
        }

        function init() {
            if (!globalData) return;

            // --- Decompress Global Data First ---
            if (globalData.progressive) {
                globalData.progressive.forEach(file => {
                    if (file.words && file.words.keys && file.words.rows) {
                        file.words = decompressData(file.words);
                    }
                });
            }
            if (globalData.priority && globalData.priority.keys && globalData.priority.rows) {
                globalData.priority = decompressData(globalData.priority);
            }

            // Zen Mode flattens everything. 
            // We just take the first file in 'progressive' for now 
            // or concatenate them if multiple? 
            // Requirement says "The file name", implying focus on one or sequential.
            // Let's render everything sequentially but show headers for files.

            const container = document.getElementById('word-list');

            // For minimalist approach, let's just render the ALL words in order
            // But we need to update the top bar "File Name" based on scroll position maybe?
            // Or just list them with simple dividers.

            // Let's stick to the First incomplete file for "Zen Focus" 
            // or if completed, the next one.

            // Actually, usually users analyze 5-6 files.
            // Let's render all of them.

            // Calculate Total Words for Zen Limit visibility
            const totalWords = globalData.progressive.reduce((acc, file) => acc + file.words.length, 0);
            const headerH1 = document.querySelector('.zen-header h1');
            if (headerH1) {
                const countSpan = document.createElement('span');
                countSpan.style.fontSize = "0.8rem";
                countSpan.style.color = "#666";
                countSpan.style.marginLeft = "15px";
                countSpan.style.fontWeight = "normal";
                countSpan.innerText = `(${totalWords} words)`;
                headerH1.appendChild(countSpan);
            }

            renderAllFiles(container);

            // Setup Keyboard
            setupKeyboard();
        }

        function renderAllFiles(container) {
            const progressive = globalData.progressive || [];

            progressive.forEach(fileData => {
                // Create File Section Wrapper
                const sectionDiv = document.createElement('div');
                sectionDiv.className = "file-section-wrapper";
                sectionDiv.style.marginBottom = "80px";

                // File Header (Name + Divider)
                const headerDiv = document.createElement('div');
                headerDiv.style.textAlign = "left";
                headerDiv.style.marginBottom = "20px";
                headerDiv.style.borderBottom = "1px solid #333";
                headerDiv.style.paddingBottom = "10px";
                headerDiv.innerHTML = `<h2 style="color: #fff; font-size: 1.4rem; font-weight: bold; margin: 0;">${fileData.filename.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</h2>`;
                sectionDiv.appendChild(headerDiv);

                // --- Per-File Stats ---
                const stats = calculateFileStats(fileData.words);
                if (stats) {
                    const statsBar = createComprehensionBar(stats);
                    // Adjust style for inside-list
                    statsBar.style.marginBottom = "40px";
                    statsBar.style.border = "none";
                    statsBar.style.background = "transparent";
                    sectionDiv.appendChild(statsBar);
                }

                // Render Words
                fileData.words.forEach(word => {
                    sectionDiv.appendChild(createWordItem(word));
                });

                container.appendChild(sectionDiv);
            });
        }

        // --- Per-sentence source badge (mirrors web_app.html) ------------------------------------ #
        // globalSourceDisplay: 'off' | 'icon' | 'filename' | 'full'  (Settings -> Experience & UI)
        // globalSources rows are [name, type, fullPath, groupLabel]; sentences carry an index into
        // that table. Shows the short name, hovers group/file, copies the FULL path (Explorer).
        const SOURCE_ICONS = { subtitle: '🎬', youtube: '▶', epub: '📖', text: '📄' };

        // --- Speech (optional Koe module; mirrors web_app.html) ---------------------------------- #
        // globalKoe is {port, probe, token} when enabled, else null. No API key lives in this page:
        // a file:// page can neither keep a secret nor write to the snippets folder, so it asks a
        // loopback-only helper that owns both. With Surasura closed the badge just copies the path.
        const KOE = (typeof globalKoe !== 'undefined' && globalKoe) ? globalKoe : null;
        let koeOrigin = null;
        let koeAudio = null;

        function koeEnabled() { return !!(KOE && KOE.token); }

        async function koeFindOrigin() {
            if (koeOrigin) return koeOrigin;
            const base = Number(KOE.port) || 8787;
            const span = Math.max(1, Number(KOE.probe) || 1);
            for (let p = base; p < base + span; p++) {
                const origin = 'http://127.0.0.1:' + p;
                try {
                    const res = await fetch(origin + '/health', { cache: 'no-store' });
                    if (res.ok) {
                        const info = await res.json();
                        if (info && info.service === 'koe') { koeOrigin = origin; return origin; }
                    }
                } catch (e) { /* nothing listening there — try the next */ }
            }
            return null;
        }

        async function koeSpeak(el) {
            const text = el.dataset.koeText || '';
            if (!text || el.dataset.koeBusy === '1') return;

            const original = el.innerHTML;
            const originalTitle = el.title;
            el.dataset.koeBusy = '1';
            el.innerHTML = '<span class="koe-spinner"></span>';

            const restore = (message) => {
                el.innerHTML = original;
                el.dataset.koeBusy = '';
                if (message) {
                    el.title = message;
                    setTimeout(() => { el.title = originalTitle; }, 5000);
                }
            };

            try {
                const origin = await koeFindOrigin();
                if (!origin) { restore('Speech needs Surasura to be running.'); return; }

                const url = origin + '/speak'
                    + '?token=' + encodeURIComponent(KOE.token)
                    + '&lang=' + encodeURIComponent((typeof globalLanguage !== 'undefined' ? globalLanguage : 'ja'))
                    + '&text=' + encodeURIComponent(text);
                const res = await fetch(url, { cache: 'no-store' });

                if (!res.ok) {
                    // A real reply, just an unhappy one — the helper is there, so keep the origin.
                    let message = 'Could not generate audio.';
                    try { const body = await res.json(); if (body && body.error) message = body.error; } catch (e) {}
                    restore(message);
                    return;
                }

                const blob = await res.blob();
                if (koeAudio) { try { koeAudio.pause(); } catch (e) {} }
                const objectUrl = URL.createObjectURL(blob);
                koeAudio = new Audio(objectUrl);
                koeAudio.addEventListener('ended', () => URL.revokeObjectURL(objectUrl), { once: true });
                koeAudio.play().catch(() => {});
                el.classList.add('koe-ready');   // on disk now — don't wait for a re-render
                restore(null);
            } catch (e) {
                koeOrigin = null;   // helper vanished (app closed) — re-probe next time
                restore('Speech needs Surasura to be running.');
            }
        }

        // Chrome/Edge "scroll to text" link — opens the file and jumps to + highlights the sentence.
        // Shift-click copies this instead of the bare path (a URL fragment would break Explorer).
        //
        // The anchor is NOT guessed here — the tokenizer drops every space when it rebuilds a
        // sentence, so anything derived from the stored text spans gaps the file doesn't have. The
        // GENERATOR verifies a snippet against the real file (AnchorFinder) and passes it in as
        // `frag`; no frag means no link. Mirrors web_app.html.
        function sourceDeepLink(fullPath, frag) {
            if (!fullPath || !frag) return '';
            let p = String(fullPath).replace(/\\/g, '/');
            if (!p.startsWith('/')) p = '/' + p;
            // encodeURI leaves '#' and '?' alone; in a FILENAME they would truncate the URL.
            const url = 'file://' + encodeURI(p).replace(/#/g, '%23').replace(/\?/g, '%3F');
            return url + '#:~:text=' + encodeURIComponent(String(frag)).replace(/-/g, '%2D');
        }

        // Seconds -> '12:03' (or '1:02:03'). Used for the subtitle cue a sentence sits in.
        function fmtCueTime(sec) {
            const t = Math.max(0, Math.floor(Number(sec) || 0));
            const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
            const pad = n => String(n).padStart(2, '0');
            return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
        }

        function sourceBadge(idx, frag, at, text, hasAudio) {
            const mode = (typeof globalSourceDisplay !== 'undefined') ? globalSourceDisplay : 'off';
            if (mode === 'off' || idx === null || idx === undefined || idx === "") return '';
            const table = (typeof globalSources !== 'undefined' && globalSources) ? globalSources : null;
            const row = table ? table[idx] : null;
            if (!row) return '';   // results generated before the source table existed

            const name = row[0] || '';
            const icon = SOURCE_ICONS[row[1]] || SOURCE_ICONS.text;
            const fullPath = row[2] || name;
            // group/file, e.g. 'test_book/chapter_1.txt' — plus the cue time for subtitles.
            let hover = row[3] || name;
            if (at !== null && at !== undefined && at !== "") hover += ' @ ' + fmtCueTime(at);
            let label;
            if (mode === 'icon') label = icon;
            else if (mode === 'filename') label = escapeHtml(name);
            else label = icon + ' ' + escapeHtml(name);

            // For a YouTube source the VIDEO is the thing, not the transcript file: click opens it
            // at this sentence's moment, shift-click opens the transcript there instead.
            // (Mirrors web_app.html.)
            const videoId = row[4] || '';
            if (videoId) {
                const secs = (at !== null && at !== undefined && at !== "")
                    ? '?t=' + Math.max(0, Math.floor(Number(at) || 0)) : '';
                const href = 'https://youtu.be/' + encodeURIComponent(videoId) + secs;
                // Shift-click opens the TRANSCRIPT at this sentence instead.
                const transcript = sourceDeepLink(fullPath, frag);
                return `<a class="src-badge" href="${escapeHtml(href)}" target="_blank" rel="noopener" ` +
                       `migaku_ignore data-yomichan-ignore data-src-path="${escapeHtml(href)}" ` +
                       `data-src-url="${escapeHtml(href)}" ` +
                       (transcript ? `data-src-transcript="${escapeHtml(transcript)}" ` : ``) +
                       `title="${escapeHtml(hover)}\nClick to open the video here` +
                       (transcript ? `\nShift-click to open the transcript at this sentence` : ``) +
                       `" onclick="return youtubeBadgeClick(event, this)">${label}</a>`;
            }

            // Paths in data-attributes, not inline JS strings — a filename containing a
            // double-quote would close the onclick attribute early.
            // With speech on, a plain click READS the sentence instead of copying the path.
            const deepLink = sourceDeepLink(fullPath, frag);
            const speak = koeEnabled() && text;
            const ready = speak && hasAudio;      // lit = plays instantly, see web_app.html
            return `<span class="src-badge${speak ? ' koe-speak' : ''}${ready ? ' koe-ready' : ''}" migaku_ignore data-yomichan-ignore ` +
                   `data-src-path="${escapeHtml(fullPath)}" ` +
                   (deepLink ? `data-src-url="${escapeHtml(deepLink)}" ` : ``) +
                   (speak ? `data-koe-text="${escapeHtml(text)}" ` : ``) +
                   `title="${escapeHtml(hover)}\n` +
                   (speak ? (ready ? `Click to hear this sentence (ready)`
                                   : `Click to hear this sentence`)
                          : `Click to copy the full path`) +
                   (deepLink ? `\nShift-click to open it at this sentence` : ``) + `" ` +
                   `onclick="copySourcePath(event, this)">${label}</span>`;
        }

        // A real link activation rather than window.open — a file:// navigation is far more likely
        // to be allowed when it comes from an anchor.
        function openInNewTab(url) {
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        // Plain click opens the VIDEO at this moment; shift-click opens the TRANSCRIPT at the same
        // sentence (the browser would otherwise open a new window).
        function youtubeBadgeClick(event, el) {
            if (event && event.shiftKey) {
                event.preventDefault();
                const transcript = el.dataset.srcTranscript;
                if (transcript) openInNewTab(transcript);
                else copySourcePath(event, el);
                return false;
            }
            return true;
        }

        function copySourcePath(event, el) {
            if (event) event.stopPropagation();
            // Shift-click OPENS the file at this sentence, exactly like a YouTube badge's
            // shift-click opens its transcript; plain click copies the bare path. With no
            // verified anchor there is nothing to jump to, so fall back to copying.
            if (event && event.shiftKey && el.dataset.srcUrl) {
                openInNewTab(el.dataset.srcUrl);
                return;
            }
            // Speech takes over the plain click when the module is on; falls through to copying
            // whenever it's off or this badge carries no sentence.
            if (koeEnabled() && el.dataset.koeText) {
                koeSpeak(el);
                return;
            }
            const path = el.dataset.srcPath || '';
            if (!path) return;
            const previous = el.innerHTML;
            const confirm = () => {
                el.textContent = 'copied ✓';
                setTimeout(() => { el.innerHTML = previous; }, 1200);
            };
            // navigator.clipboard needs a secure context and the report is opened over file://,
            // which some browsers don't treat as one — fall back to the legacy textarea trick.
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(path).then(confirm).catch(() => legacyCopy(path, confirm));
            } else {
                legacyCopy(path, confirm);
            }
        }

        function legacyCopy(text, onDone) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                onDone();
            } catch (e) {
                // No clipboard access — the hover tooltip still shows the full path.
            }
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return "";
            return String(text)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // The word's OWN sentence is exempt from the analyzer's length cap so a word always has an
        // example; a speech transcript can therefore run to several hundred characters. Window it
        // around the target word for DISPLAY only — the stored sentence is left untouched.
        function contextCap() {
            const c = (typeof globalLogic !== 'undefined' && globalLogic && globalLogic.context) ? globalLogic.context : null;
            return (c && c.max_chars) ? c.max_chars : 150;
        }

        function trimContext(text, word, cap) {
            if (!text || text.length <= cap) return { text: text || "", trimmed: false };

            // Locate the word the same way the highlighter does, so the visible window is always
            // the part that actually gets the <em>. A lemma that never surfaces leaves us at the
            // head of the sentence.
            let at = 0, wordLen = 0;
            if (word) {
                const m = text.match(new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'));
                if (m) { at = m.index; wordLen = m[0].length; }
            }

            // Build the window out of WHOLE CLAUSES rather than slicing at a character offset —
            // a raw slice cuts mid-phrase ("…の中には" out of "世の中"), which reads worse than
            // simply showing a little less.
            const BREAKS = '、。！？!?,.　・ ';
            const clauses = [];
            let cur = "";
            for (let i = 0; i < text.length; i++) {
                cur += text[i];
                if (BREAKS.indexOf(text[i]) !== -1) { clauses.push(cur); cur = ""; }
            }
            if (cur) clauses.push(cur);

            let k = 0, pos = 0;
            for (let i = 0; i < clauses.length; i++) {
                if (pos + clauses[i].length > at) { k = i; break; }
                pos += clauses[i].length;
            }

            // Grow outward from the word's own clause — right first, then left — while we fit.
            let lo = k, hi = k, total = clauses[k].length;
            for (;;) {
                let grew = false;
                if (hi + 1 < clauses.length && total + clauses[hi + 1].length <= cap) { total += clauses[++hi].length; grew = true; }
                if (lo - 1 >= 0 && total + clauses[lo - 1].length <= cap) { total += clauses[--lo].length; grew = true; }
                if (!grew) break;
            }

            let body = clauses.slice(lo, hi + 1).join("").trim();
            let head = lo > 0, tail = hi < clauses.length - 1;

            // Degenerate case: a transcript with no punctuation at all is ONE giant clause. Fall
            // back to a hard character window so a card can never be flooded.
            if (body.length > cap) {
                let start = Math.max(0, at - Math.floor(Math.max(0, cap - wordLen) / 2));
                let end = Math.min(text.length, Math.max(start + cap, at + wordLen));
                start = Math.max(0, Math.min(start, end - cap));
                body = text.slice(start, end).trim();
                head = start > 0;
                tail = end < text.length;
            }

            return { text: (head ? '…' : '') + body + (tail ? '…' : ''), trimmed: true };
        }

        function createWordItem(data) {
            const el = document.createElement('div');
            el.className = 'word-item';

            const word = data.Word;
            const safeWord = escapeHtml(word);
            const reading = data.Reading || "";
            // Parsing Block: Reverse reading and escape quotes for HTML attribute
            const reversedReading = reading.split('').reverse().join('').replace(/"/g, '&quot;');
            const freq = data["Occurrences (Global)"] || data.Occurrences || 0;

            // Priority Logic
            let prioIcon = "";
            const pm = (globalLogic && globalLogic.priority_markers) ? globalLogic.priority_markers : { priority_threshold: 0.5, priority_min: 3, lopsided_threshold: 0.8 };
            const high = parseInt(data["Count (High)"]) || 0;
            const low = parseInt(data["Count (Low)"]) || 0;

            if (freq > 0 && (high / freq) >= pm.lopsided_threshold) {
                prioIcon = `<span class="prio-icon prio-lop" title="Lopsided">⚖</span>`;
            } else if (freq >= pm.priority_min && ((high + low) / freq) >= pm.priority_threshold) {
                prioIcon = `<span class="prio-icon prio-high" title="High Leverage">✦</span>`;
            }

            // Reading word (文). Precomputed by the analyzer — it needs the bundled spoken-frequency
            // data, so unlike ✦ / ⚖ it can't be derived here. Appended rather than branched: a word
            // can be both high-leverage and read-only.
            if (data.Modality === 'reading') {
                prioIcon += `<span class="prio-icon prio-reading" title="Reading word: you'll meet this in text but hardly ever hear it">文</span>`;
            }

            // Context Formatting
            const formatContext = (ctx) => {
                if (!ctx) return "";
                const safeCtx = escapeHtml(ctx);
                const wordForRegex = safeWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(wordForRegex, 'gi');
                return safeCtx.replace(regex, `<em>${safeWord}</em>`);
            };

            const contexts = [];
            const contextKeys = Object.keys(data).filter(k => k.startsWith('Context ')).sort((a, b) => {
                const numA = parseInt(a.replace('Context ', ''));
                const numB = parseInt(b.replace('Context ', ''));
                return numA - numB;
            });

            contextKeys.forEach(k => {
                // Keep each sentence paired with its own source ("Context 3" -> "Src 3"/"Frag 3").
                const n = k.replace('Context ', '');
                if (data[k]) contexts.push({ text: data[k], src: data['Src ' + n],
                                             frag: data['Frag ' + n], at: data['At ' + n],
                                             aud: data['Aud ' + n] });
            });

            const zenCap = contextCap();
            const contextHtml = contexts.map(c => {
                const t = trimContext(c.text, data.Word, zenCap);
                // Keep the untrimmed sentence reachable on hover when we windowed it.
                const tip = t.trimmed ? ` title="${escapeHtml(c.text)}"` : '';
                return `<span class="context-line"${tip}>${formatContext(t.text)}${sourceBadge(c.src, c.frag, c.at, t.text, c.aud)}</span>`;
            }).join("");

            el.innerHTML = `
                    <div class="word-header">
                        <span class="word-main no-select" migaku_ignore data-yomichan-ignore>${safeWord}</span>
                        <span class="reading" migaku_ignore data-yomichan-ignore data-content="${reversedReading}"></span>
                        <div class="meta-info no-select" migaku_ignore data-yomichan-ignore>
                            ${prioIcon}
                            <span>Freq: ${freq}</span>
                        </div>
                    </div>
                    <div class="context-box">
                        ${contextHtml}
                    </div>
                `;

            return el;
        }

        // Removed updateHeaderStats as it's now per-file

        function calculateFileStats(words) {
            if (!words || !words.length) return null;
            const first = words[0];
            const last = words[words.length - 1];

            return {
                baseline: parseFloat(first["Baseline %"]) || 0,
                start: parseFloat(first["Current %"]) || 0,
                target: parseFloat(last["New %"]) || 0,
                known: last["Known Count"] || 0,
                total: last["Total Count"] || 0
            };
        }

        function createComprehensionBar(stats) {
            const el = document.createElement('div');
            el.className = 'comprehension-stats';

            const baseWidth = stats.baseline;
            const startWidth = stats.start - stats.baseline;
            const targetWidth = stats.target - stats.start;

            // Stats HTML (Below Bar)
            const fileGrowth = (stats.target - stats.start).toFixed(2);

            el.innerHTML = `
            <div class="stats-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <span style="font-weight: bold; color: #fff; font-size: 1.1rem; letter-spacing: 1px;">Learning Growth</span>
                <span style="color: #fff; font-weight: bold; font-size: 1.1rem;">Target: ${stats.target.toFixed(2)}%</span>
            </div>
            <div class="progress-container" style="height: 6px; background: #222; margin-bottom: 8px;">
                <div class="progress-segment" style="width: ${baseWidth}%; background: #666; opacity: 0.3;"></div>
                <div class="progress-segment" style="width: ${startWidth}%; background: #888; opacity: 0.6;"></div>
                <div class="progress-segment" style="width: ${targetWidth}%; background: #aaa;"></div>
            </div>
            <div style="display: flex; gap: 15px; font-size: 0.85rem; color: #666;">
                <span>Base: ${stats.baseline.toFixed(1)}%</span>
                <span>Start: ${stats.start.toFixed(1)}%</span>
                <span style="margin-left:auto; color: #888;">(+${fileGrowth}%)</span>
            </div>`;
            return el;
        }

        function setupKeyboard() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'j') {
                    window.scrollBy({ top: 100, behavior: 'smooth' });
                }
                if (e.key === 'k') {
                    window.scrollBy({ top: -100, behavior: 'smooth' });
                }
                if (e.code === 'Space' || e.code === 'ArrowRight') {
                    e.preventDefault();
                    scrollToNextWord();
                }
                if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    scrollToPrevWord();
                }
            });
        }

        function getActiveWordIndex() {
            const words = document.querySelectorAll('.word-item');
            if (words.length === 0) return -1;

            const center = window.innerHeight / 2;
            let closestI = -1;
            let minDiff = Infinity;

            words.forEach((w, i) => {
                const rect = w.getBoundingClientRect();
                const diff = Math.abs(rect.top + (rect.height / 2) - center);
                if (diff < minDiff) {
                    minDiff = diff;
                    closestI = i;
                }
            });
            return closestI;
        }

        function scrollToNextWord() {
            const words = document.querySelectorAll('.word-item');
            const idx = getActiveWordIndex();
            if (idx !== -1 && idx < words.length - 1) {
                words[idx + 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (words.length > 0 && idx === -1) {
                words[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function scrollToPrevWord() {
            const words = document.querySelectorAll('.word-item');
            const idx = getActiveWordIndex();
            if (idx > 0) {
                words[idx - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Init on load
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>

</html>
